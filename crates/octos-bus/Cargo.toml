[package]
name = "octos-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Message bus, channels, and session management for octos gateway"

[features]
default = []
api = ["axum"]
telegram = ["teloxide"]
discord = ["serenity"]
slack = ["tokio-tungstenite"]
whatsapp = ["tokio-tungstenite"]
feishu = ["tokio-tungstenite", "axum", "rustls", "rustls-native-certs"]
line = ["axum"]
twilio = ["axum"]
wecom = ["axum"]
matrix = ["axum"]
wecom-bot = ["tokio-tungstenite", "rustls", "rustls-native-certs"]
qq-bot = ["tokio-tungstenite", "rustls", "rustls-native-certs"]
wechat = ["tokio-tungstenite"]
email = ["async-imap", "tokio-rustls", "rustls", "webpki-roots", "lettre", "mailparse"]
# Cokret v1 channel (account + applet modes). Pulls the cokret-rust-sdk path
# crates plus an axum listener for the applet inbound endpoints.
cokret = [
    "dep:cokret-http-client",
    "dep:cokret-core",
    "dep:cokret-identifiers",
    "dep:cokret",
    "dep:cokret-bridge-runtime",
    "dep:zeroize",
    "dep:url",
    "axum",
]

[dependencies]
octos-core = { workspace = true }
tokio = { workspace = true }
lru = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
cron = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde_yml = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }

# Optional: channel integrations
teloxide = { workspace = true, optional = true }
serenity = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

# Optional: email / wecom-bot TLS
async-imap = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
mailparse = { workspace = true, optional = true }

# Optional: Cokret v1 channel — cokret-rust-sdk path crates + helpers.
# Same relative path depth as the savfox integration (sibling repos under the
# shared workspace root). The bridge runtime is pulled with the `edge` feature
# (no diesel) so the file-backed SeqStore in `cokret::seq_store` backs it.
cokret-http-client = { path = "../../../../cokret/cokret-rust-sdk/crates/http-client", optional = true, default-features = false }
cokret-core = { path = "../../../../cokret/cokret-rust-sdk/crates/core", optional = true, default-features = false, features = ["client"] }
cokret-identifiers = { path = "../../../../cokret/cokret-rust-sdk/crates/identifiers", optional = true, default-features = false }
cokret = { path = "../../../../cokret/cokret-rust-sdk/crates/sdk", optional = true, default-features = false, features = ["client", "applet-runtime", "full-surface", "signer"] }
cokret-bridge-runtime = { path = "../../../../cokret/bridges/crates/runtime", optional = true, default-features = false, features = ["edge"] }
zeroize = { version = "1", optional = true }
url = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
proptest = { workspace = true }
